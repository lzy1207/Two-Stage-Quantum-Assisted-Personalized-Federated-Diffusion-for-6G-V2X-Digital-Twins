[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qv2x-reconstructed"
version = "1.0.0"
description = "Two-stage quantum-assisted personalized federated diffusion REM reconstruction"
requires-python = ">=3.10"
dependencies = ["torch>=2.2,<3", "numpy>=1.23,<3", "scipy>=1.10,<2", "matplotlib>=3.7,<4", "Pillow>=9.5,<12"]

[project.scripts]
qv2x = "qv2x.__main__:main"

[tool.setuptools.packages.find]
include = ["qv2x*"]
